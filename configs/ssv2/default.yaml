epochs: 30
warmup_epochs: 5
learning_rate: 0.0001
weight_decay: 0.05
microbatch: 1
effective_batch: 16
num_workers: 4
prefetch_factor: 2
persistent_workers: true
gradient_clip: 1.0
validation_interval: 1
early_stop: false
optimizer: adamw
scheduler: cosine
selection_rule: highest_val_top1_then_earlier_epoch
train_annotations: third_party/UniFormer/video_classification/data_list/sthv2/somesomev2_rgb_train_split.txt
val_annotations: third_party/UniFormer/video_classification/data_list/sthv2/somesomev2_rgb_validation_split.txt
labels: datasets/ssv2/labels/labels.json
videos: datasets/ssv2/videos
